---
- name: Restart all Docker containers and verify status
  hosts: all
  gather_facts: false
  become: true

  tasks:
    - name: Restart all Docker containers (including stopped ones to start them)
      # Ensure 'ansible.builtin.shell:' is exactly as shown below,
      # with 'args:' indented exactly two spaces from it.
      ansible.builtin.shell: docker restart $(docker ps -aq)
      register: restart_output
      changed_when: true
      args: # <--- Ensure this 'args:' is indented by 4 spaces from the task name,
            #     and 2 spaces from 'ansible.builtin.shell:' line above it.
        warn: false # <--- Ensure this 'warn: false' is indented by 2 spaces from 'args:'

    - name: Display restart command output
      ansible.builtin.debug:
        msg: "Docker restart command output:\n{{ restart_output.stdout }}"
      when: restart_output.stdout | length > 0

    - name: Verify currently running Docker containers
      # Same indentation rules apply here for 'ansible.builtin.shell:' and 'args:'
      ansible.builtin.shell: docker ps
      register: verify_output
      changed_when: false
      args: # <--- Indentation must be correct here too.
        warn: false

    - name: Display currently running Docker containers
      ansible.builtin.debug:
        msg: "Currently running Docker containers:\n{{ verify_output.stdout }}"
      when: verify_output.stdout | length > 0

    - name: Handle case where no containers were found
      ansible.builtin.debug:
        msg: "No Docker containers found to restart or verify on this host."
      when: restart_output.stdout == "" and verify_output.stdout == ""
