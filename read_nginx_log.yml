---
- name: Read Nginx access log on vm3
  hosts: all # Target only vm3 or its IP if not named vm3 in inventory
  gather_facts: false
  become: true # Needed for 'sudo su' and accessing /var/log

  tasks:
    - name: Change to root user and read entire nginx access log
      ansible.builtin.shell: |
        sudo su -
        cat /var/log/nginx/access.log
      register: nginx_log_output
      changed_when: false # This command only reads, doesn't change state

    - name: Display Nginx access log content
      ansible.builtin.debug:
        msg: "{{ nginx_log_output.stdout_lines }}"
      when: nginx_log_output.stdout | length > 0
